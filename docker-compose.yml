services:
  postgres:
    image: postgres:16-alpine
    container_name: technest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: technest
      POSTGRES_PASSWORD: technest_dev
      POSTGRES_DB: technest
    ports:
      - "5432:5432"
    volumes:
      - technest-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technest -d technest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  technest-postgres-data:
